name: Build React App

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build

      - name: Set safe artifact name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "ARTIFACT_NAME=react-build-$(echo '${{ github.ref_name }}' | tr '/' '-')-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          retention-days: 30
